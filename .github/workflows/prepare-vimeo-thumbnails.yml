name: Prepare Vimeo portfolio thumbnails
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/prepare-vimeo-thumbnails.yml'
permissions:
  contents: write
jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and optimize Vimeo preview images
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import urllib.request, urllib.parse, json, io, os
          from PIL import Image
          ids = ['1237781843','1237781842','1237781841','1237781840','1235855534','1235853191','1235851099','1235851098','1235851097','1235851095']
          os.makedirs('assets/thumbnails', exist_ok=True)
          results = {}
          for vid in ids:
              try:
                  url = 'https://vimeo.com/api/oembed.json?' + urllib.parse.urlencode({'url': 'https://vimeo.com/'+vid, 'width': 1280})
                  req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (compatible; SideWalkPortfolio/1.0)'})
                  with urllib.request.urlopen(req, timeout=20) as r: data = json.load(r)
                  thumb=data.get('thumbnail_url')
                  if not thumb: raise ValueError('oEmbed did not return a thumbnail')
                  with urllib.request.urlopen(urllib.request.Request(thumb,headers={'User-Agent':'Mozilla/5.0'}),timeout=20) as r: data_bytes=r.read()
                  im=Image.open(io.BytesIO(data_bytes)).convert('RGB')
                  if im.width>1280: im.thumbnail((1280,1280))
                  target='assets/thumbnails/'+vid+'.jpg'
                  im.save(target,quality=88,optimize=True,progressive=True)
                  results[vid]={'title':data.get('title',''),'width':im.width,'height':im.height,'bytes':os.path.getsize(target),'status':'ok'}
                  print(vid,'SUCCESS',results[vid],flush=True)
              except Exception as e:
                  results[vid]={'status':'error','message':str(e)}
                  print(vid,'ERROR',repr(e),flush=True)
          with open('assets/thumbnails/manifest.json','w') as f: json.dump(results,f,indent=2)
          PY
      - name: Commit available thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/thumbnails
          if ! git diff --cached --quiet; then
            git commit -m "Publish optimized Vimeo portfolio thumbnails"
            git push
          fi
